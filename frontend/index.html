<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="INTELORA — Enterprise AIOT Intelligence Platform. Anomaly detection, predictive maintenance, asset performance management and operational efficiency across your entire electrical estate."
    />

    <title>INTELORA — Enterprise AIOT Intelligence Platform</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Runtime configuration. In Docker this file is generated by the container
      entrypoint so one built image can be promoted across environments; in
      local development it is absent and the app falls back to VITE_* values.
    -->
    <script src="/config.js"></script>

    <!--
      Resolve the theme before first paint. Without this the page renders in
      the default theme for one frame and then swaps, which reads as a flash.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('intelora.theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : stored === 'system'
              ? (prefersLight ? 'light' : 'dark')
              : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.classList.toggle('light', theme === 'light');
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
