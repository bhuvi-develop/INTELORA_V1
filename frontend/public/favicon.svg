      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity=".4"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="9" fill="#030712"/>
  <path d="M20 5.6 32.2 12.4v13.2L20 32.4 7.8 25.6V12.4L20 5.6Z"
        fill="none" stroke="url(#g)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M20 12.6v7.6l5.3 3.1"
        fill="none" stroke="#00E5FF" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="20" r="2.2" fill="#00E5FF"/>
