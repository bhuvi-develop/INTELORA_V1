# =============================================================================
# INTELORA — nginx configuration for the single-page Presentation Layer
# =============================================================================

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Hashed build output is immutable and safe to cache aggressively.
    #
    # Served from /static/, not Vite's default /assets/, because /assets is an
    # application route (the Asset Registry). A static-file location on that
    # prefix would shadow it and return 404 on direct load or refresh.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Runtime configuration must never be cached: it is what makes one image
    # deployable to many environments.
    location = /config.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # The shell itself is revalidated on every load so deploys take effect.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Client-side routing: unknown paths resolve to the application shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
